name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, firmar y publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el release y subir assets
      packages: write # publicar imágenes en GHCR
      id-token: write # attestations de procedencia
      attestations: write # persistir las attestations en el repo
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Panel — export estático embebido
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Copiar el panel al directorio embebido
        run: |
          rm -rf apps/server/internal/webui/out
          mkdir -p apps/server/internal/webui/out
          cp -R apps/web/out/. apps/server/internal/webui/out/

      - name: Compilar linux/amd64
        timeout-minutes: 25
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p bin dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o bin/bdr-control-linux-amd64 ./apps/server/cmd/bdr-control
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-agent-linux-amd64 ./apps/agent/cmd/bdr-agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-sql-linux-amd64 ./cmd/bdr-sql
      - name: Compilar linux/arm64
        timeout-minutes: 25
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o bin/bdr-control-linux-arm64 ./apps/server/cmd/bdr-control
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-agent-linux-arm64 ./apps/agent/cmd/bdr-agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-sql-linux-arm64 ./cmd/bdr-sql
      - name: Compilar linux/arm (armv7)
        timeout-minutes: 25
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o bin/bdr-control-linux-arm ./apps/server/cmd/bdr-control
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-agent-linux-arm ./apps/agent/cmd/bdr-agent
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-sql-linux-arm ./cmd/bdr-sql
      - name: Compilar darwin/amd64
        timeout-minutes: 25
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o bin/bdr-control-darwin-amd64 ./apps/server/cmd/bdr-control
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-agent-darwin-amd64 ./apps/agent/cmd/bdr-agent
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-sql-darwin-amd64 ./cmd/bdr-sql
      - name: Compilar darwin/arm64
        timeout-minutes: 25
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o bin/bdr-control-darwin-arm64 ./apps/server/cmd/bdr-control
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-agent-darwin-arm64 ./apps/agent/cmd/bdr-agent
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-sql-darwin-arm64 ./cmd/bdr-sql
      - name: Compilar windows/amd64
        timeout-minutes: 25
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o bin/bdr-control-windows-amd64.exe ./apps/server/cmd/bdr-control
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-agent-windows-amd64.exe ./apps/agent/cmd/bdr-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/juansoler/bdr/packages/version.Version=$VERSION" -o dist/bdr-sql-windows-amd64.exe ./cmd/bdr-sql

      - name: Clave privada del canal (secreto del entorno)
        run: echo "${BDR_RELEASE_KEY}" > "$RUNNER_TEMP/release.private.pem"
        env:
          BDR_RELEASE_KEY: ${{ secrets.BDR_RELEASE_KEY }}

      - name: Bundles + SHA256SUMS + latest.json firmado
        run: |
          BDR_RELEASE_KEY="$RUNNER_TEMP/release.private.pem" ./scripts/make-release.sh \
            "${GITHUB_REF_NAME#v}" bin/bdr-control-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attestations de procedencia
        uses: actions/attest-build-provenance@v1
        # Best-effort: la acción re-verifica la entrada en Rekor tras subirla
        # y un 404 transitorio de consistencia eventual no debe bloquear un
        # release. El canal de confianza real es latest.json firmado con
        # Ed25519 + SHA256SUMS; las attestations son procedencia adicional.
        continue-on-error: true
        with:
          subject-path: |
            dist/bdr-control-*
            dist/bdr-agent-*
            dist/bdr-sql-*
            dist/uninstall-*
            dist/latest.json
            dist/latest.json.sig
            dist/SHA256SUMS
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bdr-control-*
            dist/bdr-agent-*
            dist/bdr-sql-*
            dist/uninstall-*
            dist/install-*
            dist/SHA256SUMS
            dist/latest.json
            dist/latest.json.sig
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Imagen Docker multi-arch → GHCR
        uses: docker/setup-buildx-action@v3
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/juansoler/bdr-control:${{ github.ref_name }}
            ghcr.io/juansoler/bdr-control:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
