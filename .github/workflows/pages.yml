name: Pages

# Publica la web del proyecto en https://juansoler.github.io/bdr/.
#
# El sitio vive en site/ (HTML/CSS/JS a mano, sin build de Node). Este workflow
# genera _site/ con la versión inyectada y lo publica como artefacto de Pages:
# no hay rama gh-pages ni build commiteado.
#
# Requisito, una sola vez: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Generar y publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar el sitio
        run: ./scripts/build-site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
