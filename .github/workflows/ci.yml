name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — build, vet y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt (sin diff)
        run: test -z "$(gofmt -l apps packages tools)" || { gofmt -l apps packages tools; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: Avisos de terceros (sin deriva)
        run: ./scripts/check-third-party-notices.sh
      - name: go test
        run: go test -count=1 ./...

  panel:
    name: Panel — typecheck y export estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: typecheck
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run typecheck
      - name: export estático
        working-directory: apps/web
        run: npm run build

  site:
    name: Web — generar artefacto de Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar el sitio
        run: ./scripts/build-site.sh
      - name: Comprobar el HTML generado
        run: |
          test -f _site/index.html
          grep -q 'id="main"' _site/index.html
          ! grep -R -q '__BDR_' _site

  docker-agents:
    name: Docker — etapa agents (regresión de COPY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La etapa agents del Dockerfile copia rutas selectivas (packages,
      # internal, apps/agent): si el agente pasa a importar un árbol nuevo
      # del módulo y el COPY no se actualiza, el fallo solo aparecía en el
      # release. Este job lo detecta en cada push a main.
      - name: Compilar la etapa agents
        run: docker build --target agents -f deploy/Dockerfile.server .

  secrets:
    name: Secretos — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulns:
    name: Vulnerabilidades — govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
